<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki de consultas — Rector</title>
<style>
  :root{
    --ink:#15211c; --paper:#f4f1e9; --card:#fbfaf5; --line:#d9d4c4;
    --muted:#6b6b5e; --accent:#1d6b53; --accent-soft:#dfeee7;
    --code-bg:#11231d; --code-ink:#d4e8df;
    --rad:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  header{padding:32px 20px 20px;max-width:1000px;margin:0 auto;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  h1{margin:0;font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.02em;}
  .sub{color:var(--muted);margin:8px 0 0;font-size:15px;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 60px;}
  .controls{position:sticky;top:0;background:var(--paper);padding:14px 0;z-index:5;border-bottom:1px solid var(--line);}
  #search{width:100%;padding:13px 15px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--sans);}
  #search:focus{outline:none;border-color:var(--accent);}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
  .pill{font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--sans);transition:.12s;}
  .pill:hover{border-color:var(--accent);}
  .pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .count{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:16px 0 12px;}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px 20px;margin-bottom:14px;}
  .ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .etitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);}
  .ename{font-weight:650;font-size:16px;}
  .copy{font-family:var(--sans);font-size:13px;padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:.12s;}
  .copy:hover{border-color:var(--accent);color:var(--accent);}
  .copy.ok{background:var(--accent);color:#fff;border-color:var(--accent);}
  pre{margin:13px 0 0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:15px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55;}
  .entry pre{display:none;}
  .entry.open pre{display:block;}
  .etitle{cursor:pointer;}
  .chev{font-family:var(--mono);font-size:12px;color:var(--muted);transition:transform .15s;display:inline-block;}
  .entry.open .chev{transform:rotate(90deg);}
  .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-family:var(--mono);font-size:11px;color:var(--muted);background:rgba(0,0,0,.04);padding:2px 8px;border-radius:6px;}
  .empty{color:var(--muted);text-align:center;padding:50px 0;font-size:15px;}
  footer{max-width:1000px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12.5px;font-family:var(--mono);}
  @media (max-width:560px){ .ename{font-size:15px} pre{font-size:12px} }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Consultas internas</p>
  <h1>Wiki de consultas — Rector</h1>
  <p class="sub">Buscá una query por nombre o etiqueta. Tocá el título para ver el código, o Copiar para llevarlo al portapapeles.</p>
</header>
<div class="wrap">
  <div class="controls">
    <input id="search" type="text" placeholder="Buscar… (ej: baja, poliza, comisiones, cbu)" autocomplete="off">
    <div class="filters" id="filters"></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</div>
<footer id="foot"></footer>

<script>
const DATA = [{"cat": "Rector", "title": "Cambiar fecha liquidación cta ctes", "body": "select * from GENT_CUENTAS_CORRIENTES\n\n--modificar campo GECC_FE_LIQUIDABLE", "tags": ["cuenta corriente", "liquidacion", "fecha"]}, {"cat": "Rector", "title": "CBU / CBus", "body": "select * from RECTOR.CANT_EMISION\nwhere CNEM_COTC_CD_ORIGEN = '01'\n\n-- comienza con 044 es banco hipotecario\n-- codigo de origen 01 es CBU", "tags": ["cbu", "emision", "banco"]}, {"cat": "Rector", "title": "Alta usuarios seg", "body": "select * from SEG_USUARIO", "tags": ["usuarios", "seguridad", "alta"]}, {"cat": "Rector", "title": "Archivo de comprobación coberturas", "body": "select * from RECTOR.CARH_RIESGOS_CUBIERTOS\nwhere CARC_CARP_CD_RAMO=20\nAND CARC_CAPO_NU_POLIZA in ( 9) and\n  CARC_TP_MOV= 'P' and CARC_CACE_NU_CERTIFICADO =1\norder by CARC_CACE_NU_CERTIFICADO,CARC_CACB_CD_COBERTURA", "tags": ["coberturas", "riesgos", "poliza"]}, {"cat": "Rector", "title": "Asist (beneficios y prestadores)", "body": "select * from BENT_BENEFICIOS where BENE_CD_BENEFICIO = '35';\n\nselect * from BENT_PRESTADORES where BEPS_CD_PRESTADOR = '6';", "tags": ["asistencia", "beneficios", "prestadores"]}, {"cat": "Rector", "title": "Baja de cliente (cp)", "body": "delete CAJT_PRELIQUIDACION_DETALLE\n    where CALD_CACN_NU_CEDULA_RIF = 24144824;\n\n    DELETE CART_ROL_CLIENTES\n    WHERE CACN_CABU_NU_PERSONA = 24211445;\n\n    DELETE CART_PERSONAS_DIRECCIONES\n    WHERE CADO_NU_PERSONA = 24211445;\n    DELETE CART_PERSONAS_COMUNICACION\n    WHERE CACF_CABU_NU_PERSONA = 24211445;\n\n    DELETE CART_DOMICILIOS_BANCARIOS\n    WHERE CADM_CABU_NU_PERSONA = 24211445;\n    DELETE CART_PERSONAS_ROLES\n    WHERE CACL_CABU_NU_PERSONA = 24211445;\n\n    DELETE CART_PERSONAS_PEP\n    WHERE CPPE_CABU_NU_PERSONA = 24211445;\n\n    DELETE CART_MAE_PERSONAS\n    WHERE CABU_NU_PERSONA = 24211445;", "tags": ["baja", "cliente", "delete"]}, {"cat": "Rector", "title": "Borrar cliente (pasos)", "body": "1_Borrar polizas\n\n2_Borrar gestiones\nselect * from cant_gestiones where CNGE_CABU_NU_CUIT = '27220461063'\n\n3_Borrar comunicacion\nselect * from CART_PERSONAS_COMUNICACION where CACF_CABU_NU_PERSONA =24526837\n\n4_Borrar cuentas bancarias\nSELECT * FROM CART_DOMICILIOS_BANCARIOS WHERE CADM_CABU_NU_PERSONA = 24526837\n\n5_Borrar direcciones\nSELECT * FROM CART_PERSONAS_DIRECCIONES WHERE CADO_NU_PERSONA = 24526837\n\n6_Roles\nSELECT * FROM CART_PERSONAS_ROLES WHERE CACL_CABU_NU_PERSONA = 24526837\n\n7_Clientes\nSELECT * FROM CART_CLIENTES where CACN_NU_DOCUMENTO = '22046106'", "tags": ["baja", "cliente", "pasos"]}, {"cat": "Rector", "title": "Borrar gestiones (filtro)", "body": "CNGE_CNES_CD_ESTADO = 'P' AND CNGE_FE_ALTA > TO_DATE('23/09/2025', 'DD/MM/YYYY')", "tags": ["gestiones", "filtro", "baja"]}, {"cat": "Rector", "title": "Buscar clientes", "body": "select cl.CACN_NU_CEDULA_RIF,\ncl.CACN_NM_APELLIDO_RAZON,\ncl.CACN_NM_PERSONA_NATURAL,\ncl.CACN_TP_DOCUMENTO,\ndo.CATU_DE_DOCUMENTO,\ncl.CACN_NU_DOCUMENTO,\nTO_CHAR(cl.CACN_FE_NACIMIENTO, 'YYYYMMDD') AS FE_NACIMIENTO,\ncl.CACN_CD_SEXO,\ncl.CACN_CUIT\nfrom cart_clientes cl\ninner join cart_tipos_documentos do\non cl.CACN_TP_DOCUMENTO = do.CATU_TP_DOCUMENTO\nwhere not exists (select 1 from cart_certificados where CACE_CARP_CD_RAMO = 2\n-- codigo del ramo que necesito\nand CACE_NU_CERTIFICADO != 0 and CACN_NU_CEDULA_RIF = CACE_CACN_NU_CEDULA_RIF\nand CACN_CD_NACIONALIDAD =CACE_CACN_CD_NACIONALIDAD)\nand TO_CHAR(CACN_FE_NACIMIENTO, 'YYYY') >= 1980\nand ROWNUM <= 1000;", "tags": ["clientes", "buscar"]}, {"cat": "Rector", "title": "Buscar compromisos", "body": "SELECT *\nFROM AUDIT_COMPROMISOS\nWHERE DESCRIPCION LIKE '%T001%'\nOR DESCRIPCION LIKE '%T002%'\nOR DESCRIPCION LIKE '%T009%'\nOR DESCRIPCION LIKE '%T038%'\nOR DESCRIPCION LIKE '%T039%';", "tags": ["compromisos", "auditoria"]}, {"cat": "Rector", "title": "Buscar lote-póliza", "body": "select * from RECTOR.CART_CERTIFICADOS_ENDOSOS where CACW_CAPO_NU_POLIZA = '216'", "tags": ["lote", "poliza", "endosos"]}, {"cat": "Rector", "title": "Buscar póliza-certificados en clientes", "body": "select cl.CACN_NU_CEDULA_RIF,\ncl.CACN_NM_APELLIDO_RAZON,\ncl.CACN_NM_PERSONA_NATURAL,\ncl.CACN_TP_DOCUMENTO,\ndo.CATU_DE_DOCUMENTO,\ncl.CACN_NU_DOCUMENTO,\nTO_CHAR(cl.CACN_FE_NACIMIENTO, 'YYYYMMDD') AS FE_NACIMIENTO,\ncl.CACN_CD_SEXO,\ncl.CACN_CUIT\nfrom cart_clientes cl\ninner join cart_tipos_documentos do\non cl.CACN_TP_DOCUMENTO = do.CATU_TP_DOCUMENTO\nwhere cl.CACN_NU_DOCUMENTO = '95004579'\n\n-- Sacar cedula rif y pegar\nselect * from CART_CERTIFICADOS where CACE_CACN_NU_CEDULA_RIF = '24458677'", "tags": ["poliza", "certificados", "clientes"]}, {"cat": "Rector", "title": "Buscar pólizas", "body": "select * from RECTOR.CART_CERTIFICADOS_ENDOSOS\nwhere CACW_CASU_CD_SUCURSAL = 1 and CACW_CARP_CD_RAMO = 19\nand CACW_CAPU_CD_PRODUCTO = '615'\norder by CACW_FE_OPERACION desc", "tags": ["polizas", "buscar", "endosos"]}, {"cat": "Rector", "title": "Buscar productor-pólizas", "body": "select CNEM_CNGE_GESTION,CNEM_APELLIDO, CNEM_NOMBRE,CNEM_NUMDOC,CNEM_CANAL1,CNEM_CANAL2,CNEM_CANAL4,CNEM_COTC_CD_ORIGEN,CNEM_CADM_NU_CUENTA\nfrom cant_emision where CNEM_CAPD_CD_PRODUCTOR = '613' order by CNEM_CNGE_GESTION desc", "tags": ["productor", "polizas", "emision"]}, {"cat": "Rector", "title": "Buscar productos en clientes", "body": "-- modificar ramo y producto\nselect * from RECTOR.CART_CERTIFICADOS_ENDOSOS\nwhere CACW_CASU_CD_SUCURSAL = 1 and CACW_CARP_CD_RAMO = 9\nand CACW_CAPU_CD_PRODUCTO = '213'\norder by CACW_FE_OPERACION desc\n\n-- luego tomar el numero de poliza y buscar en rector", "tags": ["productos", "clientes", "endosos"]}, {"cat": "Rector", "title": "Buscar tabla por columna", "body": "SELECT table_name, column_name from all_tab_columns where column_name = 'CPDE_CPCO_NU_PUESTA_COBRO'", "tags": ["tabla", "columna", "metadata"]}, {"cat": "Rector", "title": "Cambiar fecha de alta de producto pend", "body": "select * from RECTOR.CANT_GESTIONES;\n\n-- BUSCAR LA GESTION NUESTRAS, LUEGO ABRIR TABLA Y FILTROS, LUEGO PEGAR EL WHERE E IR A DATA Y MODIFICAR CNGE_FE_ALTA luego procesar gestion\n\nselect * from RECTOR.CANT_GESTIONES\nwhere CNGE_CD_GESTION = 51298410\n\nselect * from RECTOR.CANT_EMISION\nwhere CNEM_CNGE_GESTION = 51296970\n\n-- Filtro con CNGE_CD_CANAL_2= gestion que necesito\n-- Me voy a data y cambio F por P y commit\n\nselect * from RECTOR.CANT_GESTIONES,CANT_EMISION\nwhere CNGE_CD_GESTION = CNEM_CNGE_GESTION and CNEM_CNGE_GESTION in (51296970)", "tags": ["fecha alta", "producto", "gestion"]}, {"cat": "Rector", "title": "Cambiar fecha de emi para pólizas", "body": "select * from RECTOR.CART_CERTIFICADOS_ENDOSOS\nwhere CACW_CARP_CD_RAMO = 9 and\nCACW_CAPO_NU_POLIZA = 855838\nand CACW_CACE_NU_CERTIFICADO= 1;", "tags": ["fecha emision", "poliza", "endosos"]}, {"cat": "Rector", "title": "Cambiar fecha de nac", "body": "select * from RECTOR.CART_MAE_PERSONAS where CABU_NU_DOCUMENTO = 12883371\n\n-- Ingresar a tabla control + enter, ir a filtro y poner CABU_NU_DOCUMENTO = 12883371, luego ir a data y modificar campo necesario, click en tilde verde y ok y cerrar, volver a consultar", "tags": ["fecha nacimiento", "personas"]}, {"cat": "Rector", "title": "Cambiar fecha de rendición facturas-cobranzas", "body": "select * from cart_puesta_cobro_det where CPDE_CAFC_NU_FACTURA = '145453601'", "tags": ["rendicion", "facturas", "cobranzas"]}, {"cat": "Rector", "title": "Clientes ramos", "body": "select cl.CACN_NU_CEDULA_RIF,\ncl.CACN_NM_APELLIDO_RAZON,\ncl.CACN_NM_PERSONA_NATURAL,\ncl.CACN_TP_DOCUMENTO,\ndo.CATU_DE_DOCUMENTO,\ncl.CACN_NU_DOCUMENTO,\nTO_CHAR(cl.CACN_FE_NACIMIENTO, 'YYYYMMDD') AS FE_NACIMIENTO,\ncl.CACN_CD_SEXO,\ncl.CACN_CUIT\nfrom cart_clientes cl\ninner join cart_tipos_documentos do\non cl.CACN_TP_DOCUMENTO = do.CATU_TP_DOCUMENTO\nwhere not exists (select 1 from cart_certificados where CACE_CARP_CD_RAMO = 2\nand CACE_NU_CERTIFICADO != 0 and CACN_NU_CEDULA_RIF = CACE_CACN_NU_CEDULA_RIF\nand CACN_CD_NACIONALIDAD =CACE_CACN_CD_NACIONALIDAD)\nand TO_CHAR(CACN_FE_NACIMIENTO, 'YYYY') >= 1950\nand ROWNUM <= 1000;\n\nselect * from RECTOR.CART_PRODPLANES_CONVERSOR\nwhere CPPC_CARP_CD_RAMO_O = 2;\n\nSELECT CACN_NU_DOCUMENTO,\nCACW_CARP_CD_RAMO, CACW_CAPU_CD_PRODUCTO, CACW_CAPB_CD_PLAN\nFROM CART_CERTIFICADOS_ENDOSOS\n,CART_CLIENTES\n,CART_PRODUCTOS_ANEXOS\nWHERE CACN_CD_NACIONALIDAD = CACW_CACE_CD_NACIONALIDAD\nAND CACN_NU_CEDULA_RIF = CACW_CACE_NU_CEDULA\nAND CAPA_CAPU_CD_PRODUCTO = CACW_CAPU_CD_PRODUCTO\nAND CACW_CARP_CD_RAMO = 17\nAND CACW_CAPU_CD_PRODUCTO = 501\nAND CACW_FE_DESDE > TO_DATE('01/03/2022','DD/MM/YYYY')\nAND CACW_CAME_TP_TRANSAC NOT IN ('A','U')", "tags": ["clientes", "ramos", "productos", "conversor"]}, {"cat": "Rector", "title": "Clientes - personas jurídicas", "body": "select * from cart_mae_personas where CABU_CATZ_CD_RAZON_SOCIAL = 2", "tags": ["clientes", "juridica", "personas"]}, {"cat": "Procedimiento", "title": "CMD (red Windows - net user / wifi)", "body": "net user c06856 /do\n\nnet user c06856 /domain\nnet user a05546 /domain\nnet user a04752 /domain\nnet user a05809 /domain\nnet user a05952 /domain\n-- Saber contraseña - modificar nombre de red\n\n-- nombre wifi\nnetsh wlan show profile\nnetsh wlan show profile name=HS-WIFI key=clear", "tags": ["cmd", "red", "wifi", "windows"]}, {"cat": "Rector", "title": "Coberturas asignadas a productos", "body": "SELECT * FROM CART_PRODUCTOS_COBERTURAS where CAPF_CARP_CD_RAMO = 18 and CAPF_CAPU_CD_PRODUCTO = 223", "tags": ["coberturas", "productos"]}, {"cat": "Rector", "title": "Coberturas límites", "body": "SELECT * FROM CART_PRODPLANES_COBERTURAS WHERE CAPT_CARP_CD_RAMO = 2 AND CAPT_CAPU_CD_PRODUCTO ='219'", "tags": ["coberturas", "limites", "prodplanes"]}, {"cat": "Rector", "title": "Coberturas", "body": "select * from RECTOR.CARH_RIESGOS_CUBIERTOS\nwhere CARC_CARP_CD_RAMO=9\nAND CARC_CAPO_NU_POLIZA in (855846) and\nCARC_TP_MOV= 'P' and  CARC_CACE_NU_CERTIFICADO =1\norder by CARC_CACE_NU_CERTIFICADO,CARC_CACB_CD_COBERTURA", "tags": ["coberturas", "riesgos", "poliza"]}, {"cat": "Rector", "title": "Coberturas - ingreso emisión SA", "body": "select * from CRET_DEFINICION_PRODUCTOS where CRDP_CARP_CD_RAMO = '2' and CRDP_CAPU_CD_PRODUCTO = 219 and CRDP_CD_COLUMNA_EMISION\nlike 'SGSUMASEG%'", "tags": ["coberturas", "emision", "definicion"]}, {"cat": "Rector", "title": "Códigos provincias", "body": "select * from CART_ESTADOS order by CAES_CD_ESTADO;", "tags": ["provincias", "estados", "codigos"]}, {"cat": "Rector", "title": "Cola procesos", "body": "select * from RECTOR.CART_ORDENES_PROCESOS\n\n-- pasar CAOS_ST_A de N a O, sino sale es porque se corrió el proceso", "tags": ["procesos", "cola", "ordenes"]}, {"cat": "Rector", "title": "Comisiones - temp", "body": "SELECT CBQV_CBQD_CD_BUSQUEDA,CBQV_FE_EFECTIVA,CBQV_FE_HASTA,CBQV_DATO1,CBQV_DATO2,CBQV_DATO3,CBQV_DATO4,CBQV_DATO5,CBQV_VALOR_RETORNO,CBQV_CAUS_CD_USUARIO,CBQV_ESTADO,CBQV_FE_ACTUALIZACION,CBQV_CAUS_CD_APROBADOR_TYP\nFROM CRET_BUSQUEDAS_VALORES_TMP\norder by CBQV_FE_ACTUALIZACION desc", "tags": ["comisiones", "temp", "busquedas"]}, {"cat": "Rector", "title": "Comisiones - Rector", "body": "SELECT CBQV_CBQD_CD_BUSQUEDA,CBQV_FE_EFECTIVA,CBQV_FE_HASTA,CBQV_DATO1,CBQV_DATO2,CBQV_DATO3,CBQV_DATO4,CBQV_DATO5,CBQV_VALOR_RETORNO,CBQV_FE_ACTUALIZACION FROM CRET_BUSQUEDAS_VALORES WHERE CBQV_DATO1 = '22' and CBQV_CBQD_CD_BUSQUEDA in ('COMIS_BASICA1','PO_COMIS_COMB2','PO_COMIS_AGAST','T_ADQ','T_ADM')", "tags": ["comisiones", "busquedas", "valores"]}, {"cat": "Rector", "title": "Condiciones particulares", "body": "SELECT DISTINCT cacw_casu_cd_sucursal codSucursal,\n       cacw_carp_cd_ramo codRamo,\n       cacw_capo_nu_poliza nroPoliza,\n       cacw_cace_nu_certificado nroCertificado,\n       cacw_nu_endoso nroEndoso,\n       cabu_nm_apellido_razon apellidoRazon,\n       cabu_nu_cuit cuit,\n       cado_de_calle calle, cado_de_numero numeroCalle,\n       gecp_de_localidad localidad, caes_de_estado estado, capa_de_pais pais,\n       cacw_capu_cd_producto codProducto\nFROM CART_CERTIFICADOS_ENDOSOS\nINNER JOIN CART_CERTIFICADOS ON cace_capo_nu_poliza=cacw_capo_nu_poliza AND cace_casu_cd_sucursal=cacw_casu_cd_sucursal AND cace_carp_cd_ramo=cacw_carp_cd_ramo AND cace_nu_certificado=cacw_cace_nu_certificado\nINNER JOIN CART_ROL_CLIENTES ON cacn_nu_cedula_rif=cace_cacn_nu_cedula_rif\nINNER JOIN CART_MAE_PERSONAS ON cacn_cabu_nu_persona=cabu_nu_persona\nINNER JOIN CART_PERSONAS_DIRECCIONES ON cado_nu_persona=cabu_nu_persona\nINNER JOIN GENT_CODIGOS_POSTALES ON gecp_nu_postal=cado_gecp_nu_postal\nINNER JOIN CART_ESTADOS ON caes_cd_estado=gecp_caes_cd_provincia\nINNER JOIN CART_PAISES ON capa_cd_pais=cabu_capa_cd_pais\nWHERE cacw_casu_cd_sucursal=? AND cacw_carp_cd_ramo=? AND cacw_capo_nu_poliza=? AND cacw_cace_nu_certificado=? AND cacw_nu_endoso=?\nORDER BY calle asc;", "tags": ["condiciones particulares", "direcciones", "poliza"]}, {"cat": "Rector", "title": "Conversión cód postales", "body": "select * from GENT_CODIGOS_POSTALES WHERE GECP_NU_POSTAL = 1306258", "tags": ["codigo postal", "conversion"]}, {"cat": "Rector", "title": "Conversor coberturas", "body": "SELECT * FROM CART_PRODPLANES_CONVERSOR WHERE CPPC_CARP_CD_RAMO_O = 2 AND CPPC_CAPU_CD_PRODUCTO_O = 002 and CPPC_CD_PLAN_O = 104", "tags": ["conversor", "coberturas", "prodplanes"]}, {"cat": "Rector", "title": "Cúmulos productos", "body": "select * from CART_PRODUCTOS_ANEXOS where CAPA_CAPU_CD_PRODUCTO = '401'", "tags": ["cumulos", "productos", "anexos"]}, {"cat": "Rector", "title": "Delivery Masivo - Lanzador", "body": "SELECT ROWNUM as ID_LOTE,\n       CE.CACW_CARP_CD_RAMO AS CD_RAMO,\n       CE.CACW_CAPO_NU_POLIZA AS NU_POLIZA,\n       CE.CACW_CACE_NU_CERTIFICADO AS NU_CERTIF,\n       CE.CACW_NU_ENDOSO AS NU_ENDOSO,\n       TO_CHAR(CE.CACW_FE_OPERACION,'DD/MM/YYYY') AS FE_EMISION,\n       TO_CHAR(CE.CACW_FE_OPERACION,'DD/MM/YYYY') AS FE_OPERACION,\n       TO_CHAR(CE.CACW_FE_DESDE,'DD/MM/YYYY') AS FE_DESDE,\n       TO_CHAR(CE.CACW_FE_HASTA,'DD/MM/YYYY') AS FE_HASTA,\n       CE.CACW_CAPU_CD_PRODUCTO AS CD_PRODUCTO,\n       CE.CACW_CAPB_CD_PLAN AS PLAN,\n       'M' AS TP_DELIVERY,\n       NVL(DPE.DVPE_ENVIO_ELECTRONICO, 0) AS ENVIAR_ELECTRONICO,\n       NVL(DPE.DVPE_ENVIO_FISICO, 0) AS ENVIAR_FISICO\nFROM CART_CERTIFICADOS_ENDOSOS CE\nINNER JOIN DVRY_POLITICAS_ENVIOS DPE\n   ON (DPE.DVPE_TP_DELIVERY = 'M'\n       AND DPE.DVPE_CAPU_CARP_CD_RAMO = CE.CACW_CARP_CD_RAMO\n       AND DPE.DVPE_CAPU_CD_PRODUCTO = CE.CACW_CAPU_CD_PRODUCTO\n       AND DPE.DVPE_CAME_TP_TRANSAC = CE.CACW_CAME_TP_TRANSAC\n       AND DPE.DVPE_CAME_CD_MOTIVO = CE.CACW_CAME_CD_MOTIVO\n       AND (DPE.DVPE_ENVIO_FISICO = '1' OR DPE.DVPE_ENVIO_ELECTRONICO = '1')\n       AND DPE.DVPE_ACTIVO = 1\n       AND CE.CACW_FE_OPERACION >= DPE.DVPE_FECHA_VIGENCIA)\nWHERE CE.CACW_CASU_CD_SUCURSAL = 1\n   AND CE.CACW_CACE_NU_CERTIFICADO > 0\n   AND CE.CACW_CARP_CD_RAMO = 2\n   AND CE.CACW_CAPU_CD_PRODUCTO = '221'\n   AND (('E'='E' AND CE.CACW_FE_ENTREGA IS NULL) OR ('E'='R' AND CE.CACW_FE_ENTREGA IS NOT NULL))\n   AND CE.CACW_CAME_TP_TRANSAC = (SELECT ID_TP_TRANSAC_RECTOR FROM DVRY_EQUIV_TRANSACCION WHERE ID_TIPO_TRANSACCION = 2)", "tags": ["delivery", "masivo", "envios", "lanzador"]}, {"cat": "Rector", "title": "Descripción productos ramo", "body": "---- DESCRIPCION DE RAMO PRODUCTO COBERTURA X RAMO\nSELECT PC.capf_carp_cd_ramo RAMO, RP.CARP_DE_RAMO, PC.CAPF_CAPU_CD_PRODUCTO, P.CAPU_DE_PRODUCTO, CAPF_CACB_CD_COBERTURA, C.CACB_DE_COBERTURA\nFROM CART_PRODUCTOS_COBERTURAS PC\n  INNER JOIN CART_RAMOS_POLIZAS RP ON PC.CAPF_CARP_CD_RAMO = RP.CARP_CD_RAMO\n  INNER JOIN CART_PRODUCTOS P ON P.CAPU_CARP_CD_RAMO = PC.CAPF_CARP_CD_RAMO AND P.CAPU_CD_PRODUCTO = PC.CAPF_CAPU_CD_PRODUCTO\n  INNER JOIN CART_COBERTURAS C ON C.CACB_CARP_CD_RAMO = PC.CAPF_CARP_CD_RAMO AND PC.CAPF_CACB_CD_COBERTURA = C.CACB_CD_COBERTURA\nWHERE CAPF_CAPU_CD_PRODUCTO IN(250,251,252,254,256,257,258,259,260,262,264,267) AND RP.CARP_CD_RAMO = 19\nORDER BY 1,3,5;", "tags": ["descripcion", "productos", "ramo", "coberturas"]}, {"cat": "Rector", "title": "Diaria (productores)", "body": "select R.CAPD_CD_ASOCIADO,R.capd_cd_productor codigoHS,R.CAPD_TP_ENVIO,R.CAPD_FE_APROBACION,P.CABU_NU_CUIT,P.CABU_NM_APELLIDO_RAZON as RazonSocial,P.CABU_NM_PERSONA,R.CAPD_CD_CATEGORIA_PRODUCTOR,\nP.CABU_FE_ACTUALIZACION,P.CABU_CATZ_CD_RAZON_SOCIAL,R.CAPD_NU_SUPERINTENDENCIA, P.CABU_FE_ALTA\nFROM CART_ROL_PRODUCTORES R\nINNER JOIN cart_mae_personas p ON (R.CAPD_CABU_NU_PERSONA = P.CABU_NU_PERSONA) where R.capd_cd_productor > 600 order by R.capd_cd_productor;\n\nselect * from cart_mae_personas where cabu_nu_cuit = '20260056841'\n\nselect * from CART_PERSONAS_COMUNICACION where CACF_CABU_NU_PERSONA = '24108391'\n\nselect R.capd_cd_productor codigoHS,R.CAPD_CD_CATEGORIA_PRODUCTOR, C.CACF_DE_COMUNICACION FROM CART_ROL_PRODUCTORES R\nINNER JOIN CART_PERSONAS_COMUNICACION C ON (R.CAPD_CABU_NU_PERSONA = C.CACF_CABU_NU_PERSONA) WHERE capd_cd_productor = '622'\n\nselect * from CART_PERSONAS_DIRECCIONES where CADO_NU_PERSONA = '24108391'", "tags": ["diaria", "productores", "comunicacion"]}, {"cat": "Rector", "title": "Direcciones", "body": "SELECT DISTINCT cacw_casu_cd_sucursal codSucursal,\n       cacw_carp_cd_ramo codRamo, cacw_capo_nu_poliza nroPoliza,\n       cacw_cace_nu_certificado nroCertificado, cacw_nu_endoso nroEndoso,\n       cabu_nm_apellido_razon apellidoRazon, cabu_nu_cuit cuit,\n       cado_de_calle calle, cado_de_numero numeroCalle,\n       gecp_de_localidad localidad, caes_de_estado estado, capa_de_pais pais,\n       cacw_capu_cd_producto codProducto\nFROM CART_CERTIFICADOS_ENDOSOS\nINNER JOIN CART_CERTIFICADOS ON cace_capo_nu_poliza=cacw_capo_nu_poliza AND cace_casu_cd_sucursal=cacw_casu_cd_sucursal AND cace_carp_cd_ramo=cacw_carp_cd_ramo AND cace_nu_certificado=cacw_cace_nu_certificado\nINNER JOIN CART_ROL_CLIENTES ON cacn_nu_cedula_rif=cace_cacn_nu_cedula_rif\nINNER JOIN CART_MAE_PERSONAS ON cacn_cabu_nu_persona=cabu_nu_persona\nINNER JOIN CART_PERSONAS_DIRECCIONES ON cado_nu_persona=cabu_nu_persona\nINNER JOIN GENT_CODIGOS_POSTALES ON gecp_nu_postal=cado_gecp_nu_postal\nINNER JOIN CART_ESTADOS ON caes_cd_estado=gecp_caes_cd_provincia\nINNER JOIN CART_PAISES ON capa_cd_pais=cabu_capa_cd_pais\nWHERE cacw_carp_cd_ramo=2 AND cacw_capo_nu_poliza=2476427 AND cacw_cace_nu_certificado=1", "tags": ["direcciones", "poliza", "clientes"]}, {"cat": "Rector", "title": "Domicilio - bien asegurado", "body": "select * from CRET_DIRECCION_BIENES where CRDB_CARP_CD_RAMO = 2 and CRDB_CAPO_NU_POLIZA = 2506607", "tags": ["domicilio", "bien", "direccion bienes"]}, {"cat": "Rector", "title": "Facturación", "body": "select * from cart_facturas where CAFC_CARP_CD_RAMO = 19 and CAFC_CAPO_NU_POLIZA = 2079 and CAFC_NU_ENDOSO = 1", "tags": ["facturacion", "facturas", "poliza"]}, {"cat": "Rector", "title": "Gastos adm-adq", "body": "SELECT CBQV_CBQD_CD_BUSQUEDA, CBQV_FE_EFECTIVA,CBQV_DATO1,CBQV_DATO2,CBQV_VALOR_RETORNO FROM CRET_BUSQUEDAS_VALORES WHERE CBQV_DATO1 = '18' AND CBQV_DATO2 = '211' and CBQV_CBQD_CD_BUSQUEDA IN ('T_ADM','T_ADQ') order by CBQV_FE_EFECTIVA desc", "tags": ["gastos", "administracion", "adquisicion", "comisiones"]}, {"cat": "Rector", "title": "Gestión Mora", "body": "SELECT NOMBRE, CUIT,\n       RAMO|| '/' ||POLIZA|| '/' ||CERTIFICADO AS RAPOCE,\n       DESC_RAMO, PRODUCTO, NRO_PUESTA_AL_COBRO, ORIGENPAGO, CDORIGEN,\n       PRODUCTOR, CD_PRODUCTOR, TELEFONO_CELULAR, TELEFONO_LINEA, EMAIL,\n       COD_RECHAZO, MP_RECHAZO, ESTADO, DESC_RECHAZO, CANT_RECHAZO, MONTO,\n       PC_FE_VENCIMIENTO, CPDE_FE_RESPUESTA, VIGENCIA_DESDE\nFROM (SELECT DISTINCT DE.CPDE_CARP_CD_RAMO RAMO,\n             DE.CPDE_CAPO_NU_POLIZA POLIZA,\n             DE.CPDE_CACE_NU_CERTIFICADO CERTIFICADO,\n             CL.CACN_NM_APELLIDO_RAZON || ', ' ||CL.CACN_NM_PERSONA_NATURAL NOMBRE,\n             CL.CACN_CUIT CUIT,\n             (SELECT R.CARP_DE_RAMO FROM CART_RAMOS_POLIZAS R WHERE R.CARP_CD_RAMO = DE.CPDE_CARP_CD_RAMO) DESC_RAMO,\n             PR.CAPU_DE_PRODUCTO PRODUCTO,\n             CTC.COTC_DE_ORIGEN ORIGENPAGO, CTC.COTC_CD_ORIGEN CDORIGEN,\n             PRS.CAPD_NM_PRODUCTOR PRODUCTOR, CC.CACE_CAPD_CD_PRODUCTOR CD_PRODUCTOR,\n             DE.CPDE_ST_ESTADO ESTADO, CE.CPCR_DE_RECHAZO DESC_RECHAZO, DE.CPDE_MT_MONTO MONTO,\n             TO_CHAR(DE.CPDE_FE_VENCIMIENTO,'DD/MM/YYYY') PC_FE_VENCIMIENTO,\n             TO_CHAR(DE.CPDE_FE_RESPUESTA,'DD/MM/YYYY') CPDE_FE_RESPUESTA,\n             (SELECT D.CACF_DE_COMUNICACION FROM CART_PERSONAS_COMUNICACION D\n              WHERE D.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA\n                AND D.CACF_NU_CONSECUTIVO = (SELECT MAX(CACF_NU_CONSECUTIVO) FROM CART_PERSONAS_COMUNICACION D1 WHERE D1.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA AND D1.CACF_CATN_CD_TIPO_COMUNICACION = 17)\n                AND D.CACF_CATN_CD_TIPO_COMUNICACION = 17) TELEFONO_CELULAR,\n             (SELECT D.CACF_DE_COMUNICACION FROM CART_PERSONAS_COMUNICACION D\n              WHERE D.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA\n                AND D.CACF_NU_CONSECUTIVO = (SELECT MAX(CACF_NU_CONSECUTIVO) FROM CART_PERSONAS_COMUNICACION D1 WHERE D1.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA AND D1.CACF_CATN_CD_TIPO_COMUNICACION IN (15,16))\n                AND D.CACF_CATN_CD_TIPO_COMUNICACION IN (15,16)) TELEFONO_LINEA,\n             (SELECT D.CACF_DE_COMUNICACION FROM CART_PERSONAS_COMUNICACION D\n              WHERE D.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA\n                AND D.CACF_NU_CONSECUTIVO = (SELECT MAX(CACF_NU_CONSECUTIVO) FROM CART_PERSONAS_COMUNICACION D1 WHERE D1.CACF_CABU_NU_PERSONA = CL.CACN_CABU_NU_PERSONA AND D1.CACF_CATN_CD_TIPO_COMUNICACION IN (7,13,14))\n                AND D.CACF_CATN_CD_TIPO_COMUNICACION IN (7,13,14)) EMAIL,\n             DE.CPDE_ID_RECHAZO COD_RECHAZO, DE.CPDE_MP_RECHAZO MP_RECHAZO,\n             (SELECT COUNT(1) FROM CART_PUESTA_COBRO_DET DE2 WHERE DE2.CPDE_CPCO_NU_PUESTA_COBRO < DE.CPDE_CPCO_NU_PUESTA_COBRO AND DE2.CPDE_CARP_CD_RAMO = DE.CPDE_CARP_CD_RAMO AND DE2.CPDE_CAPO_NU_POLIZA = DE.CPDE_CAPO_NU_POLIZA AND DE2.CPDE_CACE_NU_CERTIFICADO = DE.CPDE_CACE_NU_CERTIFICADO AND DE2.CPDE_ST_ESTADO = 0) CANT_RECHAZO,\n             (SELECT TO_CHAR(MIN(CACW_FE_DESDE),'DD/MM/YYYY') FROM CART_CERTIFICADOS CC2 INNER JOIN CART_CERTIFICADOS_ENDOSOS CE ON (CC2.CACE_CASU_CD_SUCURSAL=CE.CACW_CASU_CD_SUCURSAL AND CC2.CACE_CARP_CD_RAMO=CE.CACW_CARP_CD_RAMO AND CC2.CACE_CAPO_NU_POLIZA=CE.CACW_CAPO_NU_POLIZA AND CC2.CACE_NU_CERTIFICADO=CE.CACW_CACE_NU_CERTIFICADO) WHERE CC2.CACE_CACN_NU_CEDULA_RIF=CC.CACE_CACN_NU_CEDULA_RIF AND CC2.CACE_NU_APARTADO=CC.CACE_NU_APARTADO AND CC2.CACE_CARP_CD_RAMO=CC.CACE_CARP_CD_RAMO) VIGENCIA_DESDE,\n             C.CPCO_NU_PUESTA_COBRO NRO_PUESTA_AL_COBRO\n      FROM CART_PUESTA_COBRO C\n        INNER JOIN CART_PUESTA_COBRO_DET DE ON (C.CPCO_NU_PUESTA_COBRO = DE.CPDE_CPCO_NU_PUESTA_COBRO)\n        LEFT JOIN CART_EXCLUSIONES_PUESTA_COB CE ON (CE.CPCR_CD_RECHAZO=DE.CPDE_ID_RECHAZO AND CE.CPCR_CAMD_CD_MEDIO_PAGO=C.CPCO_CAMD_CD_MEDIO_PAGO AND CE.CPCR_COTC_CD_ORIGEN=C.CPCO_COTC_CD_ORIGEN)\n        INNER JOIN CART_POLIZAS P ON (C.CPCO_CD_SUCURSAL=P.CAPO_CASU_CD_SUCURSAL AND DE.CPDE_CARP_CD_RAMO=P.CAPO_CARP_CD_RAMO AND DE.CPDE_CAPO_NU_POLIZA=P.CAPO_NU_POLIZA)\n        INNER JOIN CART_CERTIFICADOS CC ON (1=CC.CACE_CASU_CD_SUCURSAL AND DE.CPDE_CARP_CD_RAMO=CC.CACE_CARP_CD_RAMO AND DE.CPDE_CAPO_NU_POLIZA=CC.CACE_CAPO_NU_POLIZA AND DECODE(CAPO_TP_POLIZA,'I',1,DE.CPDE_CACE_NU_CERTIFICADO)=CC.CACE_NU_CERTIFICADO)\n        INNER JOIN COBT_TIPOS_COBRANZAS CTC ON (C.CPCO_CAMD_CD_MEDIO_PAGO=CTC.COTC_CAMD_CD_MEDIO_PAGO AND C.CPCO_COTC_CD_ORIGEN=CTC.COTC_CD_ORIGEN AND C.CPCO_CJCM_CD_COMPANIA=CTC.COTC_CD_CIA_CONTABLE)\n        INNER JOIN CART_PRODUCTOS PR ON (CC.CACE_CARP_CD_RAMO=PR.CAPU_CARP_CD_RAMO AND CC.CACE_CAPU_CD_PRODUCTO=PR.CAPU_CD_PRODUCTO)\n        INNER JOIN CART_CLIENTES CL ON (CC.CACE_CACN_NU_CEDULA_RIF=CL.CACN_NU_CEDULA_RIF)\n        INNER JOIN CART_PRODUCTORES PRS ON (CC.CACE_CAPD_CD_PRODUCTOR=PRS.CAPD_CD_PRODUCTOR)\n        INNER JOIN CART_ENDOSOS_DATOS ED ON (CC.CACE_CARP_CD_RAMO=ED.CRCB_CARP_CD_RAMO AND CC.CACE_CAPO_NU_POLIZA=ED.CRCB_CAPO_NU_POLIZA AND CC.CACE_NU_CERTIFICADO=ED.CRCB_CACE_NU_CERTIFICADO AND CC.CACE_NU_ENDOSO=ED.CRCB_NU_ENDOSO)\nWHERE TRUNC(DE.CPDE_FE_PUESTA_COBRO) BETWEEN TRUNC(SYSDATE,'MM') AND TRUNC(LAST_DAY(SYSDATE))\n       AND CC.CACE_CAPD_CD_PRODUCTOR = 509)\n--AND DE.CPDE_ST_ESTADO = 0", "tags": ["mora", "rechazos", "cobranzas", "puesta cobro"]}, {"cat": "Rector", "title": "Gestiones", "body": "Select *\nFrom CANT_GESTIONES\nWhere CNGE_CAPO_NU_POLIZA = '855501'\n\nselect * from CANT_GESTIONES where CNGE_CABU_NU_CUIT = '20269048787'", "tags": ["gestiones", "poliza", "cuit"]}, {"cat": "Rector", "title": "Gestiones - emisión", "body": "SELECT g.CNGE_CD_GESTION,e.CNEM_NOMBRE,e.CNEM_APELLIDO,e.CNEM_NUMDOC,e.CNEM_CANAL4,e.CNEM_CAPD_CD_PRODUCTOR,g.CNGE_CAPU_CARP_CD_RAMO,g.CNGE_CAPU_CD_PRODUCTO,\ng.CNGE_CNES_CD_ESTADO, g.CNGE_CNTR_CD_TRAMITE\nFROM CANT_GESTIONES g\nINNER JOIN CANT_EMISION e\non g.CNGE_CD_GESTION = e.CNEM_CNGE_GESTION\nwhere g.CNGE_CNTR_CD_TRAMITE = 73 and e.CNEM_CAPD_CD_PRODUCTOR = '612' and g.CNGE_CNES_CD_ESTADO = 'P'", "tags": ["gestiones", "emision", "tramite"]}, {"cat": "Rector", "title": "IMINT (importes internos)", "body": "select * from cret_busquedas_valores\nwhere CBQV_CTAP_CD_APLICACION = 'COMPONENTES'\nand CBQV_CBQD_CD_BUSQUEDA = 'PO_IMP_INT'", "tags": ["importe interno", "componentes", "busquedas"]}, {"cat": "Rector", "title": "Insert Emisión", "body": "select * from cant_emision where CNEM_CNGE_GESTION = 55189723", "tags": ["emision", "gestion", "insert"]}, {"cat": "Rector", "title": "Limpiar Producto - Rector", "body": "delete from CART_PROD_MEDIO_PAGO where CAPM_CARP_CD_RAMO = 18 and CAPM_CAPU_CD_PRODUCTO = '232';\ndelete from INTER_AREAS_FUNCIONALES where INAF_CD_RAMO = 18 and INAF_CD_PRODUCTO = '232';\ndelete from CRET_BUSQUEDAS_VALORES where CBQV_DATO2 = '18' and CBQV_DATO3 = '232';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'DATOS.VALIDACION' and CBAP_CD_ENLACE = '18|232|1';\ndelete from CRET_BUSQUEDAS_VALORES where CBQV_CTAP_CD_APLICACION = 'COMPONENTES' and CBQV_DATO1 = '18' and CBQV_DATO2 = '232';\ndelete from CRET_BUSQUEDAS_VALORES where CBQV_CTAP_CD_APLICACION = 'COBERTURA.PRIMA' and CBQV_CBQD_CD_BUSQUEDA = '00_TNA_PU' and CBQV_DATO1 = '18' and CBQV_DATO2 = '232';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.PRIMA' and CBAP_CD_ENLACE = '18|232|1|18|001';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.PRIMA' and CBAP_CD_ENLACE = '18|232|1|18|002';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.PRIMA' and CBAP_CD_ENLACE = '18|232|1|18|004';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.CAPITAL' and CBAP_CD_ENLACE = '18|232|1|18|001';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.CAPITAL' and CBAP_CD_ENLACE = '18|232|1|18|002';\ndelete from CRET_BUSQUEDAS_APLICACION where CBAP_CTAP_CD_APLICACION = 'COBERTURA.CAPITAL' and CBAP_CD_ENLACE = '18|232|1|18|004';\ndelete from CART_PRODUCTOS_PRODUCTOR where CPPD_CARP_CD_RAMO = 18 and CPPD_CAPU_CD_PRODUCTO = '232';\ndelete from CART_VIG_TECNICAS_PRODUCTOS where CAVT_CARP_CD_RAMO = 18 and CAVT_CAPU_CD_PRODUCTO = '232';\ndelete from CART_FR_VIGENCIAS_PRODUCTOS where CAPG_CARP_CD_RAMO = 18 and CAPG_CAPU_CD_PRODUCTO = '232';\ndelete from cart_productos_anexos where CAPA_CARP_CD_RAMO = 18 and CAPA_CAPU_CD_PRODUCTO = '232';\ndelete from CART_PRODPLANES_COBERTURAS where CAPT_CARP_CD_RAMO = 18 and CAPT_CAPU_CD_PRODUCTO = '232';\ndelete from CART_PRODPLANES where CAPB_CARP_CD_RAMO = 18 and CAPB_CAPU_CD_PRODUCTO = '232';\ndelete from CART_REASEGURO_COBERTURAS_CTTO where CACR_CARP_CD_RAMO = 18 and CACR_CAPU_CD_PRODUCTO = '232';\ndelete from CART_PRODUCTOS_COBERTURAS where CAPF_CARP_CD_RAMO = 18 and CAPF_CAPU_CD_PRODUCTO = '232';\ndelete from CRET_DEFINICION_PRODUCTOS where CRDP_CARP_CD_RAMO = 18 and CRDP_CAPU_CD_PRODUCTO = '232';\ndelete from CRET_PRODUCTOS_BIENES where CRPB_CARP_CD_RAMO = 18 and CRPB_CAPU_CD_PRODUCTO = '232';\ndelete from CART_PRODUCTOS where CAPU_CARP_CD_RAMO = 18 and CAPU_CD_PRODUCTO = '232';\ndelete from CART_CERTIFICADOS_ENDOSOS where CACW_CARP_CD_RAMO = 18 and CACW_CAPU_CD_PRODUCTO = '232';\ndelete from cart_certificados where CACE_CARP_CD_RAMO = 18 and CACE_CAPU_CD_PRODUCTO = '232';\ndelete from cart_polizas where CAPO_CARP_CD_RAMO = 18 and CAPO_NU_POLIZA = 7951;\ncommit;", "tags": ["limpiar", "producto", "delete", "baja"]}, {"cat": "Rector", "title": "Log - Rector", "body": "select * from debug_log order by ID_LOG desc", "tags": ["log", "debug"]}, {"cat": "Rector", "title": "Meses transformación", "body": "--CAPU_MESES_TRANSFORMACION\nselect CAPU_MESES_TRANSFORMACION from CART_PRODUCTOS\nWHERE CAPU_CARP_CD_RAMO = 20\nAND CAPU_CD_PRODUCTO IN('007')", "tags": ["meses", "transformacion", "productos"]}, {"cat": "Rector", "title": "Modificar mail", "body": "select * from RECTOR.CART_MAE_PERSONAS\nwhere CABU_NU_DOCUMENTO =24655482\n\nselect * from RECTOR.CART_PERSONAS_COMUNICACION\nwhere CACF_CABU_NU_PERSONA=619", "tags": ["mail", "comunicacion", "modificar"]}, {"cat": "Rector", "title": "Motivos baja", "body": "select * from CART_MOTIVOS_ENDOSOS where CAME_TP_TRANSAC = 'A'", "tags": ["motivos", "baja", "endosos"]}, {"cat": "Rector", "title": "Motivos endosos", "body": "select * from CART_MOTIVOS_ENDOSOS", "tags": ["motivos", "endosos"]}, {"cat": "Rector", "title": "Motivos rechazo Rector", "body": "select * from RECTOR.BATB_ERRORES_NOMINA\nwhere BAEN_NU_ERROR_DETALLE =0145;", "tags": ["rechazo", "errores", "nomina"]}, {"cat": "Rector", "title": "Nombre coberturas", "body": "select* from CART_COBERTURAS WHERE CACB_CARB_CD_RAMO = 20", "tags": ["coberturas", "nombre", "ramo"]}, {"cat": "Rector", "title": "Nombre de coberturas (ramo-cobertura)", "body": "-- COBERTURAS -- RAMO - COBERTURA\nSELECT * FROM CART_COBERTURAS where cacb_carb_cd_ramo =2 order by 2;", "tags": ["coberturas", "nombre", "ramo"]}, {"cat": "Rector", "title": "Número de SAP", "body": "select * from INTER_CLIEN_PROVE WHERE INCP_CUIT = 20236247997", "tags": ["sap", "cuit", "cliente proveedor"]}, {"cat": "Rector", "title": "ONESHOT (frente póliza - prima/premio)", "body": "select TO_CHAR(CACW_FE_DESDE,'DD/MM/YYYY') FE_DESDE,\n       TO_CHAR(CACW_FE_HASTA,'DD/MM/YYYY') FE_HASTA,\n       TO_CHAR(CACW_FE_OPERACION,'DD/MM/YYYY') FE_OPERACION,\n       CACW_CARP_CD_RAMO CD_RAMO, CARP_DE_RAMO DE_RAMO,\n       CACW_CAPO_NU_POLIZA NU_POLIZA, CACW_CACE_NU_CERTIFICADO NU_CERTIFICADO,\n       CACW_CAPU_CD_PRODUCTO CD_PRODUCTO, CAPU_DE_PRODUCTO DE_PRODUCTO,\n       CACE_CAPD_CD_PRODUCTOR CD_PRODUCTOR, CAPD_NM_PRODUCTOR NM_PRODUCTOR,\n       CRCB_CD_CANAL_NIVEL_1 CD_CANAL_NIVEL_1,\n       (SELECT CRTB_DE_DATO FROM CRET_TABLAS WHERE CRTB_CD_TABLA = 190512 AND CRTB_DATO1 = CRCB_CD_CANAL_NIVEL_1) CANAL1DESC,\n       (SELECT SUM(TO_NUMBER(NVL(MONTO,0))) importe\n          FROM CART_ENDOSOS_COMPONENTES\n              UNPIVOT (MONTO FOR CD_COMPONENTE IN (CASB_MT_PMA AS 'PMA')),\n               CART_COMPONENTES CO, CART_COMPONENTES_AGRUPADORES CA, CART_AGRUPADORES A\n         WHERE CD_COMPONENTE = CO.CAPP_CD_COMPONENTE\n           AND CO.CAPP_CD_COMPONENTE = CA.CACP_CAPP_CD_COMPONENTE\n           AND CA.CACP_CAAG_CD_AGRUPADOR = A.CAAG_CD_AGRUPADOR\n           AND A.CAAG_IN_VISIBLE = 'S'\n           AND CASB_CASU_CD_SUCURSAL = CACW_CASU_CD_SUCURSAL\n           AND CASB_CARP_CD_RAMO = CACW_CARP_CD_RAMO\n           AND CASB_CAPO_NU_POLIZA = CACW_CAPO_NU_POLIZA\n           AND CASB_CACE_NU_CERTIFICADO = CACW_CACE_NU_CERTIFICADO\n           AND CASB_NU_ENDOSO = CACW_NU_ENDOSO\n        GROUP BY A.CAAG_CD_AGRUPADOR, A.CAAG_DE_AGRUPADOR) PRIMA,\n       (SELECT SUM(TO_NUMBER(NVL(MONTO,0))) IMPORTE\n          FROM CART_ENDOSOS_COMPONENTES\n              UNPIVOT (MONTO FOR CD_COMPONENTE IN (CASB_MT_PREM AS 'PREM')),\n               CART_COMPONENTES CO, CART_COMPONENTES_AGRUPADORES CA, CART_AGRUPADORES A\n         WHERE CD_COMPONENTE = CO.CAPP_CD_COMPONENTE\n           AND CO.CAPP_CD_COMPONENTE = CA.CACP_CAPP_CD_COMPONENTE\n           AND CA.CACP_CAAG_CD_AGRUPADOR = A.CAAG_CD_AGRUPADOR\n           AND A.CAAG_IN_VISIBLE = 'S'\n           AND CASB_CASU_CD_SUCURSAL = CACW_CASU_CD_SUCURSAL\n           AND CASB_CARP_CD_RAMO = CACW_CARP_CD_RAMO\n           AND CASB_CAPO_NU_POLIZA = CACW_CAPO_NU_POLIZA\n           AND CASB_CACE_NU_CERTIFICADO = CACW_CACE_NU_CERTIFICADO\n           AND CASB_NU_ENDOSO = CACW_NU_ENDOSO\n        GROUP BY A.CAAG_CD_AGRUPADOR, A.CAAG_DE_AGRUPADOR) PREMIO,\n       (SELECT COUNT(*) FROM CART_FACTURAS WHERE CAFC_CARP_CD_RAMO = CACW_CARP_CD_RAMO AND CAFC_CAPO_NU_POLIZA = CACW_CAPO_NU_POLIZA) CANTFACTURAS,\n       CABU_NU_CUIT CUITCLIENTE,\n       TO_CHAR((SELECT MAX(CACW_FE_OPERACION) FROM CART_CERTIFICADOS_ENDOSOS CE1 WHERE CE1.CACW_CAME_TP_TRANSAC = 'A' AND CE1.CACW_CARP_CD_RAMO = CE.CACW_CARP_CD_RAMO AND CE1.CACW_CAPO_NU_POLIZA = CE.CACW_CAPO_NU_POLIZA AND CE1.CACW_CACE_NU_CERTIFICADO = CE.CACW_CACE_NU_CERTIFICADO),'DD/MM/YYYY') FECHABAJA\nFROM CART_CERTIFICADOS_ENDOSOS CE\n    INNER JOIN CART_RAMOS_POLIZAS ON CARP_CD_RAMO = CE.CACW_CARP_CD_RAMO\n    INNER JOIN CART_PRODUCTOS ON CAPU_CD_PRODUCTO = CE.CACW_CAPU_CD_PRODUCTO\n    INNER JOIN CART_CERTIFICADOS ON CACE_CASU_CD_SUCURSAL = CE.CACW_CASU_CD_SUCURSAL AND CACE_CARP_CD_RAMO = CE.CACW_CARP_CD_RAMO AND CACE_CAPO_NU_POLIZA = CE.CACW_CAPO_NU_POLIZA AND CACE_NU_CERTIFICADO = CE.CACW_CACE_NU_CERTIFICADO\n    INNER JOIN CART_PRODUCTORES ON CAPD_CD_PRODUCTOR = CACE_CAPD_CD_PRODUCTOR\n    INNER JOIN CART_ENDOSOS_DATOS ON CRCB_CASU_CD_SUCURSAL = CE.CACW_CASU_CD_SUCURSAL AND CRCB_CARP_CD_RAMO = CE.CACW_CARP_CD_RAMO AND CRCB_CAPO_NU_POLIZA = CE.CACW_CAPO_NU_POLIZA AND CRCB_CACE_NU_CERTIFICADO = CE.CACW_CACE_NU_CERTIFICADO AND CRCB_NU_ENDOSO = CE.CACW_NU_ENDOSO\n    INNER JOIN CART_ROL_CLIENTES ON CACN_NU_CEDULA_RIF = CACE_CACN_NU_CEDULA_RIF\n    INNER JOIN CART_MAE_PERSONAS ON CABU_NU_PERSONA = CACN_CABU_NU_PERSONA\n    WHERE CACW_CAME_TP_TRANSAC = 'E'\n    AND CACW_FE_OPERACION BETWEEN TO_DATE('20210601','YYYYMMDD') AND TO_DATE('20250831','YYYYMMDD')\n    AND CE.CACW_CARP_CD_RAMO = DECODE('2','*',CE.CACW_CARP_CD_RAMO,'2')\n    AND CAPD_NM_PRODUCTOR = DECODE('609','*',CAPD_NM_PRODUCTOR,'609')", "tags": ["oneshot", "frente poliza", "prima", "premio", "componentes"]}, {"cat": "Rector", "title": "Persona", "body": "select * from RECTOR.CART_MAE_PERSONAS\n\nselect * from RECTOR.CART_MAE_PERSONAS\n  where CABU_NU_CUIT LIKE '25%%'", "tags": ["persona", "cuit", "mae personas"]}, {"cat": "Rector", "title": "PIEZA DISTINCT (temp_pieza)", "body": "SELECT ESTADO,\n       Max(ID_PIEZA) AS ejemplo_id_pieza,\n       Max(ID_LOTE) AS ejemplo_id_lote\nFROM temp_pieza\nGROUP BY ESTADO;\n\nSELECT DISTINCT ESTADO\nFROM temp_pieza\nwhere TIPO_ENVIO = 'E'", "tags": ["pieza", "temp pieza", "distinct", "envio"]}, {"cat": "Rector", "title": "Póliza - detalles", "body": "select * from CART_ENDOSOS_DATOS where CRCB_CARP_CD_RAMO = '22' and CRCB_CAPO_NU_POLIZA = '94'", "tags": ["poliza", "detalles", "endosos datos"]}, {"cat": "Rector", "title": "Póliza - endoso", "body": "select * from CART_ENDOSOS_DATOS where CRCB_CARP_CD_RAMO = 21", "tags": ["poliza", "endoso", "endosos datos"]}, {"cat": "Rector", "title": "Pólizas creadas ABM", "body": "select * from cart_polizas", "tags": ["polizas", "abm", "creadas"]}, {"cat": "Rector", "title": "Porcentaje comisiones", "body": "SELECT CBQV_CBQD_CD_BUSQUEDA,CBQV_FE_EFECTIVA,CBQV_DATO1,CBQV_DATO2,CBQV_DATO3,CBQV_DATO4,CBQV_VALOR_RETORNO FROM CRET_BUSQUEDAS_VALORES WHERE CBQV_DATO1 = '20' AND CBQV_DATO2 = '009' AND CBQV_CBQD_CD_BUSQUEDA = 'COMIS_BASICA1'", "tags": ["comisiones", "porcentaje", "busquedas"]}, {"cat": "Rector", "title": "Productores", "body": "select DISTINCT M.CAPD_CABU_NU_PERSONA,M.capd_cd_productor codigoHS,P.CABU_NU_CUIT,M.CAPD_CD_CATEGORIA_PRODUCTOR,P.CABU_NM_APELLIDO_RAZON as RazonSocial,M.CAPD_NU_SUPERINTENDENCIA,\nP.CABU_NM_PERSONA,M.CAPD_CAVI_CD_VINCULANTE,D.CADO_DE_CALLE,D.CADO_DE_NUMERO,P.CABU_ST_SEXO, P.CABU_ESTADO_CIVIL,P.CABU_FE_ACTUALIZACION, P.CABU_FE_ALTA, M.CAPD_CD_ASOCIADO, M.CAPD_TP_ENVIO,M.CAPD_MAIL_DELIVERY,\np.CABU_IN_DDJPEPS, T.CACF_DE_COMUNICACION\nFROM CART_ROL_PRODUCTORES M\nINNER JOIN cart_mae_personas p ON M.CAPD_CABU_NU_PERSONA = P.CABU_NU_PERSONA\nINNER JOIN CART_PERSONAS_DIRECCIONES D ON P.CABU_NU_PERSONA = D.CADO_NU_PERSONA\nINNER JOIN CART_PERSONAS_COMUNICACION T ON D.CADO_NU_PERSONA = T.CACF_CABU_NU_PERSONA\nwhere M.capd_cd_productor > 599", "tags": ["productores", "comunicacion", "direcciones"]}, {"cat": "Rector", "title": "Productor-Productor", "body": "select * from CART_PRODUCTOS_PRODUCTOR where CPPD_CAPD_CD_PRODUCTOR > 620", "tags": ["productor", "productos productor"]}, {"cat": "Rector", "title": "Productos Anexos (traslada sellos)", "body": "select *\nfrom cart_productos_anexos\nwhere CAPA_CARP_CD_RAMO = '9' and CAPA_CAPU_CD_PRODUCTO = '256'", "tags": ["productos anexos", "sellos", "traslada"]}, {"cat": "Rector", "title": "Puesta al cobro facturas", "body": "select * from CART_PUESTA_COBRO_DET", "tags": ["puesta cobro", "facturas", "cobranzas"]}, {"cat": "Rector", "title": "Q lanza carga serv (PAC_INTERFAZ_SERVICIOS)", "body": "BEGIN\n   PAC_INTERFAZ_SERVICIOS.CARGA_SERVICIOS();\nEND;", "tags": ["carga servicios", "lanzador", "interfaz", "plsql"]}, {"cat": "Rector", "title": "Refa buscar x mdp", "body": "/*cambiar fecha- ramo producto y count */\nSELECT *\n       FROM CART_CERTIFICADOS\n       WHERE CACE_ST_CERTIFICADO = 1\n       AND CACE_NU_CERTIFICADO > 0\n       AND CACE_CARP_CD_RAMO = 2\n       AND CACE_CAPU_CD_PRODUCTO = '212'\n       AND CACE_FE_HASTA <= to_date('31122024', 'DDMMYYYY')\n       and CACE_CAPD_CD_PRODUCTOR= 605\n       and CACE_COTC_CD_ORIGEN = 02\n       AND NVL(CACE_FE_HASTA_TECNICA, CACE_FE_HASTA + 1) > CACE_FE_HASTA\n       AND EXISTS (\n           SELECT 1\n            FROM CART_POLIZAS\n            WHERE CAPO_CASU_CD_SUCURSAL = CACE_CASU_CD_SUCURSAL\n            AND CAPO_CARP_CD_RAMO = CACE_CARP_CD_RAMO\n            AND CAPO_NU_POLIZA = CACE_CAPO_NU_POLIZA\n            AND CAPO_NU_POLIZA_SIGUIENTE IS NULL\n            AND CAPO_IN_REFACTURACION = 'A');", "tags": ["refacturacion", "mdp", "certificados"]}, {"cat": "Rector", "title": "Refa - count o cuáles", "body": "SELECT COUNT(*) cantidad\n       FROM CART_CERTIFICADOS\n       WHERE CACE_ST_CERTIFICADO = 1\n       AND CACE_NU_CERTIFICADO > 0\n       AND CACE_CARP_CD_RAMO = 18\n       AND CACE_CAPU_CD_PRODUCTO = '227'\n       AND CACE_FE_HASTA <= to_date('31122024', 'DDMMYYYY')\n       AND NVL(CACE_FE_HASTA_TECNICA, CACE_FE_HASTA + 1) > CACE_FE_HASTA\n       AND EXISTS (\n           SELECT 1\n            FROM CART_POLIZAS\n            WHERE CAPO_CASU_CD_SUCURSAL = CACE_CASU_CD_SUCURSAL\n            AND CAPO_CARP_CD_RAMO = CACE_CARP_CD_RAMO\n            AND CAPO_NU_POLIZA = CACE_CAPO_NU_POLIZA\n            AND CAPO_NU_POLIZA_SIGUIENTE IS NULL\n            AND CAPO_IN_REFACTURACION = 'A');", "tags": ["refacturacion", "count", "certificados"]}, {"cat": "Rector", "title": "Refa - ramo producto", "body": "SELECT CAPU_CARP_CD_RAMO codigoRamo,\n             CAPU_CD_PRODUCTO codigoProducto,\n             CAPU_DE_PRODUCTO descripcion,\n             CAPU_IN_ANULACION anulable,\n             CAPU_FE_INICIO fechaInicio,\n             CAPU_ST_PRODUCTO habilitado,\n             CAPA_IN_BENEFICIARIOS beneficiario,\n             CAPA_IN_MEDIO_PAGO medioPago,\n             CAPA_CALG_CD_PLAN_PAGO planPago,\n             CAPU_MT_PRIMA_EMISION primaMinimaEmision,\n             CAPU_MT_PRIMA_ENDOSO primaMinimaEndoso,\n             CAPA_CAPD_CD_PRODUCTOR productor,\n             CAPU_IN_REFACTURACION refacturable,\n             CAPU_IN_RENOVACION renovable,\n             CAPA_IN_NEGOCIO tipoNegocio,\n             CAPA_IN_TP_CALCULO tipoCalculoVigencia,\n             CAPA_TP_CALCULO_VIGENCIA tipoObtencionVigencia,\n             CAPG_CAFP_CD_VIGENCIA tipoVigencia,\n             CAVT_CAFP_CD_VIGENCIA_TECNICA tipoVigenciaContrato,\n             CAPA_IN_TP_POLIZA tipoPoliza,\n             NVL(CAPA_IN_TP_FACTURACION,'N') tipoFacturacion,\n             CAPU_IN_VENCIMIENTO_SEGURO tipoVencimiento,\n             CAPA_CRTD_CD_DATO identificador,\n             CAPA_IN_NO_VALIDA sinValidacion,\n             CAPA_CD_CUMULO grupoCumulo,\n             CAPA_TP_VALIDACION_CUMULO tipoValidacionCumulo,\n             CAPA_IN_VALID_SINIESTRO validaSiniestro,\n             CAPA_IN_OBLIGATORIO obligatorio,\n             CAPA_IN_TRASLADA_SELLOS trasladaSellos,\n             CAPU_CD_PRODUCTO_ANTERIOR productoAnterior,\n             CAPU_CD_PRODUCTO_SIGUIENTE productoSiguiente,\n             NVL(CAPU_MESES_TRANSFORMACION,6) mesesTransformacion\n       FROM CART_PRODUCTOS P\n      INNER JOIN CART_PRODUCTOS_ANEXOS A ON (A.CAPA_CARP_CD_RAMO = P.CAPU_CARP_CD_RAMO AND A.CAPA_CAPU_CD_PRODUCTO = P.CAPU_CD_PRODUCTO)\n      INNER JOIN CART_FR_VIGENCIAS_PRODUCTOS V ON (V.CAPG_CARP_CD_RAMO = P.CAPU_CARP_CD_RAMO AND V.CAPG_CAPU_CD_PRODUCTO = P.CAPU_CD_PRODUCTO)\n      INNER JOIN CART_VIG_TECNICAS_PRODUCTOS T ON (T.CAVT_CARP_CD_RAMO = P.CAPU_CARP_CD_RAMO AND T.CAVT_CAPU_CD_PRODUCTO = P.CAPU_CD_PRODUCTO AND T.CAVT_CAFP_CD_VIGENCIA = V.CAPG_CAFP_CD_VIGENCIA)\n      WHERE CAPU_CARP_CD_RAMO = 18\n      and CAPU_CD_PRODUCTO = '227'", "tags": ["refacturacion", "ramo", "producto", "anexos"]}, {"cat": "Rector", "title": "Renovación nueva (90 días)", "body": "SELECT CACE_CARP_CD_RAMO ramo,\n                     CACE_CAPU_CD_PRODUCTO producto,\n                     count(*) cant,\n                     max(cace_fe_hasta) MAX_FE_HASTA,\n                     MIN(CACE_FE_HASTA) MIN_FE_HASTA\n               FROM CART_CERTIFICADOS\n               WHERE CACE_ST_CERTIFICADO = 1\n               AND CACE_NU_CERTIFICADO > 0\n               --AND CACE_CARP_CD_RAMO = 19\n               --and cace_capu_cd_producto = '001'\n               AND (CACE_FE_HASTA_TECNICA <= TO_DATE('31/07/2024','DD/MM/YYYY')\n               AND CACE_FE_HASTA_TECNICA <= CACE_FE_HASTA\n               AND CACE_FE_HASTA <= TO_DATE('31/07/2024','DD/MM/YYYY') )\n               AND CACE_FE_HASTA >= TRUNC(SYSDATE)-90\n               AND CACE_IN_RENOVACION = 'R'\n               AND EXISTS (\n                   SELECT 1\n                    FROM CART_POLIZAS\n                    WHERE CAPO_CASU_CD_SUCURSAL = 1\n                    AND CAPO_CARP_CD_RAMO = CACE_CARP_CD_RAMO\n                    AND CAPO_NU_POLIZA = CACE_CAPO_NU_POLIZA\n                    AND CAPO_NU_POLIZA_SIGUIENTE IS NULL\n                    )\n                group by CACE_CARP_CD_RAMO, CACE_CAPU_CD_PRODUCTO\n                order by count(*) desc", "tags": ["renovacion", "90 dias", "certificados"]}, {"cat": "Rector", "title": "Renov - pruebas cambios nuevos 90 días", "body": "SELECT /*+RULE*/\n             CACE_CASU_CD_SUCURSAL sucursal,\n             CACE_CARP_CD_RAMO ramo,\n             CACE_CAPU_CD_PRODUCTO producto,\n             CACE_CAPO_NU_POLIZA poliza,\n             CACE_NU_CERTIFICADO certificado,\n             CACE_ST_CERTIFICADO estado,\n             CACE_FE_DESDE fechaDesde,\n             CACE_FE_HASTA fechaHasta,\n             CACE_FE_ANULACION fechaAnulacion,\n             CACE_CAMD_CD_MEDIO_PAGO codigoMedio,\n             CACE_COTC_CD_ORIGEN codigoOrigen,\n             CACE_CADM_NU_DOMICILIO_DB consecutivoCuenta,\n             CACE_CADO_NU_DIRE_ENVIO consecutivoDomicilio,\n             CACE_CAFR_CD_FRAGMENT codigoPlanPago\n       FROM CART_CERTIFICADOS\n       WHERE CACE_ST_CERTIFICADO = 1\n       AND CACE_NU_CERTIFICADO > 0\n       AND CACE_CARP_CD_RAMO = 19\n       AND CACE_CAPU_CD_PRODUCTO = '310'\n       AND (CACE_FE_HASTA_TECNICA <= trunc(sysdate)\n       AND CACE_FE_HASTA_TECNICA <= CACE_FE_HASTA\n       AND CACE_FE_HASTA <= trunc(sysdate))\n       --AND CACE_FE_HASTA >= TRUNC(SYSDATE)-90\n       AND CACE_IN_RENOVACION = 'R'\n       AND CACE_CAMD_CD_MEDIO_PAGO = 4\n       --AND CACE_COTC_CD_ORIGEN = ?\n       AND EXISTS (\n           SELECT 1\n            FROM CART_POLIZAS\n            WHERE CAPO_CASU_CD_SUCURSAL = 1\n            AND CAPO_CARP_CD_RAMO = CACE_CARP_CD_RAMO\n            AND CAPO_NU_POLIZA = CACE_CAPO_NU_POLIZA\n            AND CAPO_NU_POLIZA_SIGUIENTE IS NULL)\n       ORDER BY CACE_FE_HASTA desc,\n                CACE_CARP_CD_RAMO,\n                CACE_CAPO_NU_POLIZA,\n                CACE_NU_CERTIFICADO;", "tags": ["renovacion", "90 dias", "pruebas", "certificados"]}, {"cat": "Rector", "title": "Resultados emisión", "body": "SELECT * FROM CANT_RESULTADOS", "tags": ["resultados", "emision"]}, {"cat": "Rector", "title": "Secuencia Rector (CART_ROL_PRODUCTORES_SEQ)", "body": "CREATE SEQUENCE RECTOR.CART_ROL_PRODUCTORES_SEQ\n  START WITH 618\n  MAXVALUE 999999999999999999999999999\n  MINVALUE 618\n  NOCYCLE\n  CACHE 20\n  NOORDER;\n\nDROP PUBLIC SYNONYM CART_ROL_PRODUCTORES_SEQ;\n\nCREATE OR REPLACE PUBLIC SYNONYM CART_ROL_PRODUCTORES_SEQ FOR RECTOR.CART_ROL_PRODUCTORES_SEQ;\n\nGRANT SELECT ON RECTOR.CART_ROL_PRODUCTORES_SEQ TO RECTOR_CONSULTA;\nGRANT SELECT ON RECTOR.CART_ROL_PRODUCTORES_SEQ TO RECTOR_PUBLICO;\n\nALTER TABLE RECTOR.CART_ROL_PRODUCTORES ADD (CAPD_FE_APROBACION  DATE)\n/\nALTER TABLE RECTOR.CART_ROL_PRODUCTORES ADD (CAPD_CD_ASOCIADO  VARCHAR2(80))\n/\nALTER TABLE RECTOR.CART_ROL_PRODUCTORES ADD (CAPD_TP_ENVIO  VARCHAR2(20))\n/\n\nCOMMIT;\n/", "tags": ["secuencia", "sequence", "ddl", "productores", "alter table"]}, {"cat": "Rector", "title": "seg_usuario (productores > 600)", "body": "select USUARIO, NOMBRE, APELLIDO,PRODUCTOR,CANAL1, CANAL2,CANAL4 from seg_usuario WHERE PRODUCTOR > 600", "tags": ["usuarios", "seguridad", "productor"]}, {"cat": "Rector", "title": "Sellos prov y update", "body": "SELECT MAX(GECP_NU_POSTAL) id, GECP_GEMU_CD_MUNICIPIO,\nGECP_CAES_CD_PROVINCIA codigoProvincia,\nGECP_NU_POSTAL codigoLocalidad,\nGECP_CD_CODIGO_POSTAL codigoPostal,\nGECP_DE_LOCALIDAD descripcion\nFROM GENT_CODIGOS_POSTALES C\nWHERE GECP_CAES_CD_PROVINCIA = 1\n--AND GECP_NU_POSTAL = 338\n--AND GECP_CD_CODIGO_POSTAL = 1003\n--AND TRIM(GECP_DE_LOCALIDAD) = 'BOULOGNE SUR MER'\nGROUP BY GECP_CAES_CD_PROVINCIA,\nGECP_NU_POSTAL, GECP_GEMU_CD_MUNICIPIO,\nGECP_CD_CODIGO_POSTAL,GECP_DE_LOCALIDAD\n\n\nUPDATE CANT_EMISION\nSET CNEM_DRPROV = 1,  --Codigo de provincia\nCNEM_DEPROV = 1,     --Codigo de provincia\nCNEM_DBPROV = 1,  --Codigo de provincia\nCNEM_DRLOCALIDAD = 952772, --Va el campo GECP_GEMU_CD_MUNICIPIO del script anterior\nCNEM_DELOCALIDAD = 952772, --Va el campo GECP_GEMU_CD_MUNICIPIO del script anterior\nCNEM_DBLOCALIDAD = 952772, --Va el campo GECP_GEMU_CD_MUNICIPIO del script anterior\nCNEM_DRCP = 1425,   -- va el campo CODIGOPOSTAL de script anterior\nCNEM_DECP = 1425,    -- va el campo CODIGOPOSTAL de script anterior\nCNEM_DBCP = 1425    -- va el campo CODIGOPOSTAL de script anterior\nWHERE CNEM_CNGE_GESTION in ( 51302618)  -- Gestiones a actualizar\n\nselect * from cant_emision\nwhere CNEM_CNGE_GESTION in ( 51302618)", "tags": ["sellos", "provincia", "update", "codigos postales", "emision"]}, {"cat": "Rector", "title": "Tasas coberturas", "body": "select * from CRET_BUSQUEDAS_VALORES\n where CBQV_CTAP_CD_APLICACION ='COBERTURA.PRIMA'\n and CBQV_CBQD_CD_BUSQUEDA = '00_TNA_PU'\n and CBQV_DATO1= 18\n and CBQV_DATO2 = 232", "tags": ["tasas", "coberturas", "prima", "busquedas"]}, {"cat": "Rector", "title": "Teléfono (productor)", "body": "select R.capd_cd_productor codigoHS,R.CAPD_CD_CATEGORIA_PRODUCTOR, C.CACF_DE_COMUNICACION FROM CART_ROL_PRODUCTORES R\nINNER JOIN CART_PERSONAS_COMUNICACION C ON (R.CAPD_CABU_NU_PERSONA = C.CACF_CABU_NU_PERSONA) WHERE capd_cd_productor = '622'", "tags": ["telefono", "productor", "comunicacion"]}, {"cat": "Rector", "title": "Template", "body": "select * from RECTOR.TEMP_VERSION_TEMPLATE\nwhere ID_TEMPLATE = 5", "tags": ["template", "version"]}, {"cat": "Rector", "title": "Tipo Docu", "body": "select * from CART_TIPOS_DOCUMENTOS", "tags": ["tipo documento", "documentos"]}, {"cat": "Rector", "title": "Update gestiones de emisión", "body": "UPDATE cant_gestiones\nSET CNGE_CNES_CD_ESTADO = 'R'\nWHERE CNGE_CNES_CD_ESTADO = 'P'\nAND CNGE_FE_ALTA = > '9/1/2025';\n-- OJO: '= >' es error de sintaxis; deberia ser >= y la fecha con TO_DATE('09/01/2025','DD/MM/YYYY')", "tags": ["update", "gestiones", "emision", "estado"]}];
const CATS = ["Todas","Rector","Procedimiento","SQL","SF","Concepto","Calculo"];
const LABEL = {Rector:"Rector",Procedimiento:"Procedimiento",SQL:"Query SQL",SF:"Query SF",Concepto:"Concepto",Calculo:"Cálculo"};
let activeCat = "Todas", query = "";

const filtersEl = document.getElementById("filters");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");

CATS.forEach(c=>{
  const present = c==="Todas" || DATA.some(d=>d.cat===c);
  if(!present) return;
  const b=document.createElement("button");
  b.className="pill"+(c==="Todas"?" active":"");
  b.textContent = c==="Todas"?"Todas":(LABEL[c]||c);
  b.onclick=()=>{activeCat=c;[...filtersEl.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");render();};
  filtersEl.appendChild(b);
});

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function matches(d){
  if(activeCat!=="Todas" && d.cat!==activeCat) return false;
  if(!query) return true;
  const hay=(d.title+" "+d.body+" "+d.tags.join(" ")).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}

function render(){
  const rows=DATA.filter(matches);
  countEl.textContent = rows.length+" de "+DATA.length+" consultas";
  if(!rows.length){ listEl.innerHTML='<p class="empty">Sin resultados. Probá con otra palabra.</p>'; return; }
  listEl.innerHTML = rows.map((d,i)=>{
    const tags=d.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join("");
    return '<div class="entry">'
      +'<div class="ehead"><div class="etitle"><span class="chev">&#9656;</span><span class="badge">'+(LABEL[d.cat]||d.cat)+'</span>'
      +'<span class="ename">'+esc(d.title)+'</span></div>'
      +'<button class="copy" data-i="'+i+'">Copiar</button></div>'
      +'<pre>'+esc(d.body)+'</pre>'
      +(tags?'<div class="tags">'+tags+'</div>':'')
      +'</div>';
  }).join("");
  listEl.querySelectorAll(".etitle").forEach(t=>{
    t.onclick=()=>t.closest(".entry").classList.toggle("open");
  });
  listEl.querySelectorAll(".copy").forEach(btn=>{
    btn.onclick=()=>{
      const d=rows[+btn.dataset.i];
      navigator.clipboard.writeText(d.body).then(()=>{
        btn.textContent="Copiado"; btn.classList.add("ok");
        setTimeout(()=>{btn.textContent="Copiar";btn.classList.remove("ok");},1300);
      });
    };
  });
}

searchEl.addEventListener("input",e=>{query=e.target.value.trim();render();});
document.getElementById("foot").textContent="Archivo autónomo · funciona sin internet · "+DATA.length+" consultas guardadas";
render();
</script>
